apiVersion: v1
kind: Namespace
metadata:
  name: karpati-llm-wiki
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpati-llm-wiki
  namespace: karpati-llm-wiki
  labels:
    app.kubernetes.io/name: karpati-llm-wiki
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: karpati-llm-wiki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karpati-llm-wiki
    spec:
      containers:
        - name: app
          image: harbor.edi-it.com/airuneers/karpati-llm-wiki:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "REPLACE_TAG"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: karpati-llm-wiki
  namespace: karpati-llm-wiki
  labels:
    app.kubernetes.io/name: karpati-llm-wiki
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: karpati-llm-wiki
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: karpati-llm-wiki
  namespace: karpati-llm-wiki
  annotations:
    external-dns.alpha.kubernetes.io/target: 192.168.2.202
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - karpati-llm-wiki.edi-it.com
  rules:
    - backendRefs:
        - name: karpati-llm-wiki
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: karpati-llm-wiki-http-redirect
  namespace: karpati-llm-wiki
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - karpati-llm-wiki.edi-it.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
